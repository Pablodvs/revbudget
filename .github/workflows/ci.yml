name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with BUN_VERSION in the Dockerfile and packageManager in package.json.
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker:
    name: Docker build + smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: revbudget:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the production image the way docker-compose.yml runs it (same
      # capability set and no-new-privileges), with throwaway secrets and no
      # Telegram, tunnel or Ollama.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name revbudget-smoke \
            -p 127.0.0.1:3000:3000 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e DATABASE_URL=/app/data/revbudget.db \
            -e WEBHOOK_SECRET="$(openssl rand -hex 32)" \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e DASHBOARD_ORIGIN=http://localhost:3000 \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e OLLAMA_ENABLED=false \
            revbudget:ci

          status=starting
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' revbudget-smoke)
            if [ "$status" = healthy ]; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' revbudget-smoke)" != true ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "::error::container not healthy after 90s (status: $status)"
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/api/health
          echo

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/wallets)
          if [ "$code" != 401 ]; then
            echo "::error::GET /api/wallets without a session returned $code, expected 401"
            exit 1
          fi

          # The runtime user may write its data volume and nothing else: app
          # code and the root-run entrypoint must stay immutable to it.
          docker exec -u bun revbudget-smoke sh -c '
            set -e
            touch /app/data/.write-test && rm /app/data/.write-test
            for p in /app /app/dist /app/dashboard/dist; do
              if touch "$p/.write-test" 2>/dev/null; then echo "$p is writable by bun"; exit 1; fi
            done
            if touch /usr/local/bin/entrypoint.sh 2>/dev/null; then echo "entrypoint is writable by bun"; exit 1; fi
          '
          echo "smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs revbudget-smoke 2>&1 || true

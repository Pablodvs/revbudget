version: 2

# Minor and patch bumps arrive as one grouped PR per ecosystem; majors stay
# individual PRs so each breaking change gets its own review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the Bun runtime pinned in the Dockerfile and CI: bun-types 1.4
      # declared APIs the 1.3 runtime lacks. Bump it together with the runtime.
      - dependency-name: bun-types
      # TypeScript 7 drops the JS API vue-tsc runs on. 6.x still comes through;
      # revisit once Vue's tooling supports 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      # vue-echarts follows echarts majors (vue-echarts 8 needs echarts 6), so
      # they always move together. Listed first: a dependency joins the first
      # group it matches.
      charts:
        patterns: [echarts, vue-echarts]
      bun-minor-and-patch:
        update-types: [minor, patch]
        # Pre-1.0 packages break on "minor" bumps (drizzle 0.36 to 0.45), so
        # each gets its own PR instead of hiding in this group.
        exclude-patterns: [drizzle-orm, drizzle-kit, "@hono/zod-validator"]

  # Dockerfile base image. It is pinned through BUN_VERSION/BUN_DIGEST build
  # args, so also bump the bun-version in CI and packageManager in package.json.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]

  # docker-compose.yml: the tag+digest-pinned cloudflared sidecar (optional `tunnel` profile).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        update-types: [minor, patch]

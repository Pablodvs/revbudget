name: revbudget

services:
  app:
    build:
      context: .
    image: revbudget:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/revbudget.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TRUST_PROXY: "true"
      # env_file hands the app every .env entry; it never needs the tunnel token.
      TUNNEL_TOKEN: ""
    extra_hosts:
      # Lets the container reach an Ollama running on the docker host.
      # Native on macOS/Windows; the host-gateway alias is what enables it on Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    expose:
      # Reachable to other services on the compose network (cloudflared, Traefik).
      # No host port is published: public ingress goes through the cloudflared
      # sidecar, never through the docker host.
      - "3000"
    # Uncomment for local testing without the tunnel:
    # ports:
    #   - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # entrypoint: chown -R bun:bun /app/data on fresh volumes
      - SETUID # su-exec root -> bun
      - SETGID # su-exec sets gid + supplementary groups
    mem_limit: 512m
    # 0 = no limit (prod). The public demo sets APP_CPUS=1 so a busy demo
    # can't starve other apps on the same host.
    cpus: ${APP_CPUS:-0}
    pids_limit: 256

  cloudflared:
    # Pinned tag+digest: this binary is the only ingress boundary, and
    # --no-autoupdate makes an unpinned :latest the sole (uncontrolled) update
    # channel. Updating is now a deliberate version bump here.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: ["tunnel"]
    restart: unless-stopped
    # If TUNNEL_TOKEN is empty, cloudflared exits with a clear error. The profile
    # gate means this service only starts when explicitly requested.
    # The token goes in via the environment, which cloudflared reads natively:
    # on argv it would be readable by any host user through `ps`.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Outbound-only HTTP tunnel; expect a benign "ICMP proxy disabled" log line
    # (ping proxying would want NET_RAW).
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
